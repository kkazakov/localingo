<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Localingo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
  <style>
    .lang-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: start; }
    .swap-btn { margin-top: 1.65rem; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .panel { border: 1px solid var(--muted-border-color); border-radius: var(--border-radius); display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--muted-border-color); display: flex; align-items: center; justify-content: space-between; }
    .panel-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--muted-color); letter-spacing: 0.05em; }
    textarea { flex: 1; border: none; resize: none; min-height: 280px; font-family: inherit; border-radius: 0; }
    textarea:focus { outline: none; box-shadow: none; }
    .drop-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; border: 2px dashed var(--muted-border-color); border-radius: 0; margin: 0; min-height: 280px; transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .drop-zone img { max-width: 100%; max-height: 240px; object-fit: contain; }
    .output-text { flex: 1; padding: 1rem; overflow-y: auto; white-space: pre-wrap; min-height: 280px; font-size: 0.95rem; line-height: 1.6; }
    .output-text.placeholder { color: var(--muted-color); font-style: italic; }
    .output-text.error { color: var(--del-color); }
    .footer-status { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-top: 1px solid var(--muted-border-color); font-size: 0.8rem; color: var(--muted-color); background: var(--background-color); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-color); display: inline-block; margin-right: 0.5rem; }
    .status-dot.ok { background: var(--ins-color); }
    .status-dot.error { background: var(--del-color); }
    .mode-switch { display: flex; gap: 0.25rem; background: var(--pico-muted-background-color); border-radius: var(--pico-border-radius); padding: 0.25rem; margin-bottom: 0; }
    .mode-btn { background: none; border: none; padding: 0.25rem 0.6rem; border-radius: var(--pico-border-radius); cursor: pointer; font-size: 0.8rem; color: var(--pico-muted-color); margin-bottom: 0; }
    .mode-btn[aria-current] { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
    .translate-btn { min-width: 140px; }
    @media (max-width: 768px) {
      .lang-row { grid-template-columns: 1fr; gap: 0.5rem; }
      .swap-btn { margin-top: 0; width: 100%; }
      .panels { grid-template-columns: 1fr; }
      textarea, .drop-zone, .output-text { min-height: 200px; }
    }
    .hidden { display: none !important; }
    #loading-overlay { position: fixed; inset: 0; background: var(--background-color); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    #loading-overlay.hidden { display: none !important; }
    .loading-box { text-align: center; max-width: 360px; padding: 2rem; }
    .loading-box p { color: var(--muted-color); margin-top: 0.5rem; }
    .spinner { width: 2.5rem; height: 2.5rem; border: 3px solid var(--muted-border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

          <button class="mode-btn" id="mode-text" aria-current="true">Text</button>

      </div>
      <textarea id="input-text" placeholder="Enter text to translate… (Ctrl+Enter to translate)" spellcheck="false"></textarea>
      <div class="drop-zone hidden" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" style="display:none">
        <span id="drop-label">Click or drag & drop an image</span>

    <article class="panel">
      <div class="panel-header">
        <span class="panel-label">Translation</span>
        <button class="outline secondary" id="copy-btn" style="padding:0.3rem 0.6rem;font-size:0.8rem">Copy</button>
      </div>
      <div class="output-text placeholder" id="output-text">Translation will appear here…</div>

</main>

<footer id="main-footer" class="hidden">
  <small>
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Connecting…</span>
    •
    <span id="model-name">Loading…</span>
  </small>
</footer>

<script>
  const API_KEY = '${API_KEY}';
  const API_URL = '/api/v1/chat/completions';
  let MODEL = '';

  const inputText   = document.getElementById('input-text');
  const outputText  = document.getElementById('output-text');
  const srcLang     = document.getElementById('src-lang');
  const tgtLang     = document.getElementById('tgt-lang');
  const swapBtn     = document.getElementById('swap-btn');
  const translateBtn= document.getElementById('translate-btn');
  const copyBtn     = document.getElementById('copy-btn');
  const charCount   = document.getElementById('char-count');
  const outCharCount= document.getElementById('out-char-count');
  const timing      = document.getElementById('timing');
  const modeText    = document.getElementById('mode-text');
  const modeImage   = document.getElementById('mode-image');
  const modeSwitch  = document.getElementById('mode-switch');
  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const imgPreview  = document.getElementById('img-preview');
  const dropLabel   = document.getElementById('drop-label');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');
  const modelNameDisplay = document.getElementById('model-name');

  const loadingOverlay  = document.getElementById('loading-overlay');
  const loadingSpinner  = document.getElementById('loading-spinner');
  const loadingTitle    = document.getElementById('loading-title');
  const loadingMsg      = document.getElementById('loading-msg');
  const mainHeader      = document.getElementById('main-header');
  const mainContent     = document.getElementById('main-content');
  const mainFooter      = document.getElementById('main-footer');

  let mode = 'text';
  let imageDataUrl = null;
  let loadedModel = null;
  let imageSupported = true;
  let everReady = false;

  const themeSwitcher = {
    _scheme: 'auto',
    menuTarget: 'nav ul',
    buttonsTarget: 'a[data-theme-switcher]',
    buttonAttribute: 'data-theme-switcher',
    rootAttribute: 'data-theme',
    localStorageKey: 'picoPreferredColorScheme',
    init() {
      this.scheme = this.schemeFromLocalStorage;
      this.initSwitchers();
    },
    get schemeFromLocalStorage() {
      return window.localStorage?.getItem(this.localStorageKey) ?? this._scheme;
    },
    get preferredColorScheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    },
    initSwitchers() {
      const buttons = document.querySelectorAll(this.buttonsTarget);
      buttons.forEach((button) => {
        button.addEventListener('click', (event) => {
          event.preventDefault();
          this.scheme = button.getAttribute(this.buttonAttribute);
        }, false);
      });
    },
    set scheme(scheme) {
      if (scheme == 'auto') {
        this._scheme = this.preferredColorScheme;
      } else if (scheme == 'dark' || scheme == 'light') {
        this._scheme = scheme;
      }
      this.applyScheme();
      this.schemeToLocalStorage();
    },
    get scheme() {
      return this._scheme;
    },
    applyScheme() {
      document.querySelector('html')?.setAttribute(this.rootAttribute, this.scheme);
    },
    schemeToLocalStorage() {
      window.localStorage?.setItem(this.localStorageKey, this.scheme);
    }
  };

  function loadLanguages() {
    const savedSrc = localStorage.getItem('srcLang');
    const savedTgt = localStorage.getItem('tgtLang');
    if (savedSrc) srcLang.value = savedSrc;
    if (savedTgt) tgtLang.value = savedTgt;
  }

  function saveLanguages() {
    localStorage.setItem('srcLang', srcLang.value);
    localStorage.setItem('tgtLang', tgtLang.value);
  }

  srcLang.addEventListener('change', saveLanguages);
  tgtLang.addEventListener('change', saveLanguages);

  async function checkStatus() {
    try {
      const [modelsRes, healthRes] = await Promise.all([
        fetch('/api/v1/models', { headers: { Authorization: `Bearer ${API_KEY}` } }),
        fetch('/api/health'),
      ]);
      if (!modelsRes.ok || !healthRes.ok) {
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Cannot reach backend';
        modelNameDisplay.textContent = 'Error';
        if (everReady) {
          loadingTitle.textContent = 'Back-end unreachable';
          loadingMsg.textContent = 'Cannot connect to the server. Please retry in a minute.';
          loadingSpinner.style.display = 'none';
        }
        loadingOverlay.classList.remove('hidden');
        return;
      }
      const modelsData = await modelsRes.json();
      const healthData = await healthRes.json();
      const model = modelsData.data?.[0];
      if (model) {
        everReady = true;
        MODEL = model.id;
        loadedModel = model.id;
        modelNameDisplay.textContent = model.id;
        statusDot.className = 'status-dot ok';
        statusText.textContent = 'Model ready';
        loadingOverlay.classList.add('hidden');
        mainHeader.classList.remove('hidden');
        mainContent.classList.remove('hidden');
        mainFooter.classList.remove('hidden');
      } else {
        statusDot.className = 'status-dot';
        statusText.textContent = 'Model not loaded yet';
        modelNameDisplay.textContent = 'No model';
        loadingTitle.textContent = 'Back-end loading…';
        loadingMsg.textContent = 'Please retry in a minute.';
        loadingSpinner.style.display = '';
        loadingOverlay.classList.remove('hidden');
        mainHeader.classList.add('hidden');
        mainContent.classList.add('hidden');
        mainFooter.classList.add('hidden');
      }
      imageSupported = healthData.model_type !== 'gguf';
      modeSwitch.classList.toggle('hidden', !imageSupported);
      if (!imageSupported && mode === 'image') setMode('text');
    } catch {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Cannot reach backend';
      modelNameDisplay.textContent = 'Error';
      if (everReady) {
        loadingTitle.textContent = 'Back-end unreachable';
        loadingMsg.textContent = 'Cannot connect to the server. Please retry in a minute.';
        loadingSpinner.style.display = 'none';
      }
      loadingOverlay.classList.remove('hidden');
    }
  }

  inputText.addEventListener('input', () => {
    const n = inputText.value.length;
    charCount.textContent = `${n} / 2000`;
    charCount.style.color = n > 1800 ? 'var(--del-color)' : '';
  });

  modeText.addEventListener('click', () => setMode('text'));
  modeImage.addEventListener('click', () => setMode('image'));

  function setMode(m) {
    mode = m;
    modeText.toggleAttribute('aria-current', m === 'text');
    modeImage.toggleAttribute('aria-current', m === 'image');
    inputText.classList.toggle('hidden', m !== 'text');
    dropZone.classList.toggle('hidden', m !== 'image');
  }

  swapBtn.addEventListener('click', () => {
    const s = srcLang.value, t = tgtLang.value;
    srcLang.value = t;
    tgtLang.value = s;
    saveLanguages();
    if (mode === 'text') {
      const outVal = outputText.classList.contains('placeholder') ? '' : outputText.textContent;
      const inVal  = inputText.value;
      inputText.value = outVal;
      if (outVal) {
        outputText.classList.remove('placeholder', 'error');
        outputText.textContent = inVal;
        outCharCount.textContent = `${inVal.length} chars`;
      } else {
        setOutputPlaceholder();
      }
      charCount.textContent = `${inputText.value.length} / 2000`;
    }
  });

  copyBtn.addEventListener('click', async () => {
    if (outputText.classList.contains('placeholder')) return;
    await navigator.clipboard.writeText(outputText.textContent);
    const origText = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = origText, 1200);
  });

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImage(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadImage(fileInput.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
      imageDataUrl = e.target.result;
      imgPreview.src = imageDataUrl;
      imgPreview.style.display = 'block';
      dropLabel.textContent = file.name;
    };
    reader.readAsDataURL(file);
  }

  document.addEventListener('paste', e => {
    if (mode !== 'image') return;
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        loadImage(item.getAsFile());
        break;
      }
    }
  });

  translateBtn.addEventListener('click', doTranslate);

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      doTranslate();
    }
  });

  async function doTranslate() {
    if (translateBtn.disabled) return;
    const src = srcLang.value;
    const tgt = tgtLang.value;

    if (mode === 'text') {
      const text = inputText.value.trim();
      if (!text) return;
      await translate({ type: 'text', source_lang_code: src, target_lang_code: tgt, text });
    } else {
      if (!imageDataUrl) { alert('Please select an image first.'); return; }
      await translate({ type: 'image', source_lang_code: src, target_lang_code: tgt, url: imageDataUrl });
    }
  }

  async function translate(content) {
    if (!MODEL) {
      outputText.classList.remove('placeholder');
      outputText.classList.add('error');
      outputText.textContent = 'Error: Model not loaded. Please wait for the model to be ready.';
      return;
    }

    setLoading(true);
    setOutputPlaceholder();
    timing.textContent = '';
    outCharCount.textContent = '';
    const t0 = Date.now();

    const messages = [{ role: 'user', content: [content] }];

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL,
          messages,
          max_tokens: 2048,
          temperature: 0,
          stream: false
        })
      });

      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${err}`);
      }

      const data = await resp.json();
      const result = data.choices?.[0]?.message?.content?.trim();

      if (!result) throw new Error('Empty response from model');

      outputText.classList.remove('placeholder', 'error');
      outputText.textContent = result;
      outCharCount.textContent = `${result.length} chars`;
      timing.textContent = `${((Date.now() - t0) / 1000).toFixed(1)}s`;

    } catch (err) {
      outputText.classList.remove('placeholder');
      outputText.classList.add('error');
      outputText.textContent = `Error: ${err.message}`;
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    translateBtn.disabled = on;
    if (on) {
      translateBtn.setAttribute('aria-busy', 'true');
      translateBtn.textContent = 'Please wait…';
    } else {
      translateBtn.removeAttribute('aria-busy');
      translateBtn.textContent = 'Translate';
    }
  }

  function setOutputPlaceholder() {
    outputText.className = 'output-text placeholder';
    outputText.textContent = 'Translation will appear here…';
  }

  themeSwitcher.init();
  loadLanguages();
  checkStatus();
  setInterval(checkStatus, 15000);
</script>
</body>
</html>
